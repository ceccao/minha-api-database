name: CI

on:
  push:
    branches: [ main, hml, dev ]
  pull_request:
    branches: [ main, hml, dev ]

jobs:
  validar-changelogs:
    name: Validar changelogs do Liquibase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Liquibase
        uses: liquibase/setup-liquibase@v3
        with:
          version: '5.0.4'
          edition: 'community'

      # "validate" so confere a sintaxe/estrutura do changelog - usamos o H2 em
      # memoria (ja vem embutido no proprio Liquibase, sem precisar de LPM ou de
      # um MySQL real rodando no runner) so pra satisfazer a exigencia de --url.
      - name: Validar sintaxe dos changelogs
        run: |
          liquibase validate \
            --changelog-file=changelogs/minha-api.changelog-master.xml \
            --url=jdbc:h2:mem:validacao